name: Apply BSP NPT Guide SEO Patch

on:
  push:
    branches:
      - seo/bsp-npt-guide-intent

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/bsp-npt-guide-intent
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: node scripts/apply-bsp-npt-guide-seo-patch.mjs
      - name: Remove one-time helper files
        run: rm scripts/apply-bsp-npt-guide-seo-patch.mjs .github/workflows/apply-bsp-npt-guide-seo.yml
      - name: Commit final page-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SEO: strengthen BSPP and BSPT vs NPT intent'
          git push
