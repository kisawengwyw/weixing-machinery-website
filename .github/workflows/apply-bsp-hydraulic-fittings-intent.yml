name: Apply BSP hydraulic fittings SEO intent

on:
  push:
    branches:
      - agent/bsp-hydraulic-fittings-intent

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bsp-hydraulic-fittings-intent
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded SEO replacements
        run: node scripts/apply-bsp-hydraulic-fittings-intent.mjs
      - name: Validate target scope
        run: |
          git diff -- products/bsp-hydraulic-adapters/index.html
          test -n "$(git diff -- products/bsp-hydraulic-adapters/index.html)"
      - name: Remove one-time helper and workflow
        run: |
          rm scripts/apply-bsp-hydraulic-fittings-intent.mjs
          rm .github/workflows/apply-bsp-hydraulic-fittings-intent.yml
      - name: Commit final BSP page change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/bsp-hydraulic-adapters/index.html scripts/apply-bsp-hydraulic-fittings-intent.mjs .github/workflows/apply-bsp-hydraulic-fittings-intent.yml
          git commit -m "Strengthen BSP hydraulic fittings SEO intent"
          git push
