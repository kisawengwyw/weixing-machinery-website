name: Check Production Website

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 1"
  push:
    branches: [master]
    paths:
      - "sitemap.xml"
      - "robots.txt"
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.php"
      - "assets/**"
      - "favicon.ico"
      - "favicon.svg"
      - "apple-touch-icon.png"

permissions:
  contents: read

concurrency:
  group: production-health-check
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:production
