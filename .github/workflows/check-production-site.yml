name: Check Production Website

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 1"
permissions:
  contents: read

concurrency:
  group: production-health-check
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:production
