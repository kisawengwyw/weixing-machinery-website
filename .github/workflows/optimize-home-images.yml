name: Optimize Homepage Images

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate optimized images
        run: |
          npm run images:home
          npm run images:icons

      - name: Report generated image dimensions and sizes
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const sharp = require('sharp');
          async function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) await walk(file);
              else {
                const { width, height } = await sharp(file).metadata();
                console.log(`${file}: ${width}x${height}, ${(fs.statSync(file).size / 1024).toFixed(1)} KiB`);
              }
            }
          }
          walk('assets/images/home').catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Verify site icons
        run: |
          npm run check:icons
          node - <<'NODE'
          const fs = require('node:fs');
          const sharp = require('sharp');
          Promise.all([sharp('favicon.svg').metadata(), sharp('apple-touch-icon.png').metadata()])
            .then(([, icon]) => {
              if (icon.format !== 'png' || icon.width !== 180 || icon.height !== 180 || fs.statSync('apple-touch-icon.png').size === 0) process.exit(1);
            })
            .catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Commit generated images when changed
        run: |
          git status --short
          git add assets/images/home apple-touch-icon.png package-lock.json
          if git diff --cached --quiet; then
            echo "No generated homepage or site icon changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate homepage and site icon assets"
          git push origin HEAD:${TARGET_BRANCH}
