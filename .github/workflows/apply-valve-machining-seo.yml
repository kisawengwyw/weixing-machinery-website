name: Apply Valve Machining SEO Patch

on:
  push:
    branches:
      - seo/hydraulic-valve-machining

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out SEO branch
        uses: actions/checkout@v4
        with:
          ref: seo/hydraulic-valve-machining

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded page patch
        run: node scripts/apply-valve-machining-seo.mjs

      - name: Validate structured data and target phrases
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('products/hydraulic-valve-bodies/index.html', 'utf8');
          if (!html.includes('<h1>Hydraulic Valve Machining & Custom Valve Bodies</h1>')) process.exit(1);
          if (!html.includes('hydraulic valve bore finishing')) process.exit(1);
          const match = html.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/);
          if (!match) process.exit(1);
          JSON.parse(match[1]);
          console.log('Target phrases and JSON-LD validated.');
          NODE

      - name: Remove one-time patch helpers
        run: |
          rm scripts/apply-valve-machining-seo.mjs
          rm .github/workflows/apply-valve-machining-seo.yml

      - name: Commit only the page change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products/hydraulic-valve-bodies/index.html scripts/apply-valve-machining-seo.mjs .github/workflows/apply-valve-machining-seo.yml
          git commit -m 'SEO: strengthen hydraulic valve machining intent'
          git push
