name: Check Site Links and Assets
on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.php"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/check-site-links.mjs"
      - "package.json"
      - ".github/workflows/check-site-links.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:links-checker
      - run: npm run check:links
      - run: npm run check:footers
      - run: git diff --check
