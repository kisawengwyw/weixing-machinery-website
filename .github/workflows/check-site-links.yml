name: Check Site Links and Assets
on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.php"
      - "assets/**"
      - "favicon.ico"
      - ".htaccess"
      - "favicon.svg"
      - "apple-touch-icon.png"
      - "**/*.webp"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "**/*.ico"
      - "**/manifest*.json"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/check-site-links.mjs"
      - "scripts/test-site-link-checker.mjs"
      - "scripts/check-accessibility.mjs"
      - "scripts/test-accessibility-checker.mjs"
      - "scripts/check-production-site.mjs"
      - "scripts/test-production-health-check.mjs"
      - "scripts/generate-site-icons.mjs"
      - "scripts/test-hosting-config.mjs"
      - "docs/production-health-check.md"
      - "docs/hostinger-routing-and-icons.md"
      - "package.json"
      - ".github/workflows/check-site-links.yml"
      - ".github/workflows/check-production-site.yml"
      - ".github/workflows/optimize-home-images.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:accessibility-checker
      - run: npm run check:accessibility
      - run: npm run test:links-checker
      - run: npm run test:production-checker
      - run: npm run test:hosting-config
      - run: npm run check:icons
      - run: npm run check:links
      - run: npm run check:footers
      - run: git diff --check
