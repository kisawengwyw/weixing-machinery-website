name: Apply Welded Tubing SEO Patch

on:
  push:
    branches:
      - seo/welded-tubing-assemblies

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/welded-tubing-assemblies
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-welded-tubing-seo-patch.mjs
      - name: Remove one-time helper
        run: |
          rm scripts/apply-welded-tubing-seo-patch.mjs
          rm .github/workflows/apply-welded-tubing-seo.yml
      - name: Commit SEO page update
        run: |
          git add products/welded-tube-assemblies/index.html scripts/apply-welded-tubing-seo-patch.mjs .github/workflows/apply-welded-tubing-seo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'SEO: strengthen welded tubing assemblies intent'
          git push
